name: Build Zephyr ESP32

on:
  push:
    branches: [ Zephyr ]
  pull_request:
    branches: [ Zephyr ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Firmware inside Zephyr CI Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/zephyrproject-rtos/ci:v0.27.4 \
            bash -c '
              # Initialize workspace pointing to the Software directory where west.yml lives
              west init -l Software/
              
              # Fetch all dependencies into Software/deps/
              west update
              
              # Export Zephyr CMake package
              west zephyr-export

              # Point to the pre-installed SDK inside the CI image (v0.16.x compatible)
              export ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-0.16.8

              # Run the build using the correct board specifier
              west build -p always -b esp32_devkitc/esp32/procpu Software/app
            '

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-thermal-reactor-firmware
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/zephyr.elf