name: Build Zephyr ESP32

on:
  push:
    branches: [ Zephyr ]
  pull_request:
    branches: [ Zephyr ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Firmware inside Zephyr CI Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/zephyrproject-rtos/ci:v0.27.4 \
            bash -c '
              # Initialize workspace pointing to the Software directory where west.yml lives
              west init -l Software/
              
              # Fetch all dependencies into Software/deps/
              west update
              
              # Export Zephyr CMake package
              west zephyr-export

              # Din log reiese ca imaginea are v0.17.0 instalat nativ
              export ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-0.17.0

              # Run the build folosind calea aplicatiei
              west build -p always -b esp32_devkitc/esp32/procpu Software/app

              # IMPORTANT: Reparam permisiunile fisierelor generate de Docker (root) 
              # pentru ca runner-ul de GitHub Actions sa le poata accesa la upload
              chown -R $(stat -c "%u:%g" Software/) build/
            '

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-thermal-reactor-firmware
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/zephyr.elf