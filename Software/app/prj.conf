CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=80000000

CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_ADC=y
CONFIG_ADC_ESP32=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

# Activare suport Display si I2C
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# Activare suport SPI si Senzori (MAX6675)
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_MAX6675=y